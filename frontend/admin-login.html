<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Admin Login</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<main class="app">

  <section
    class="card"
    style="max-width: 420px; margin: 80px auto;"
  >

    <div class="eyebrow">
      ADMIN
    </div>

    <h1>
      Admin login
    </h1>

    <p class="muted">
      Enter the admin password to continue.
    </p>

    <form id="loginForm">

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
        style="
          width: 100%;
          box-sizing: border-box;
          margin-bottom: 12px;
        "
      >

      <button
        class="primary"
        type="submit"
        style="width: 100%;"
      >
        Login
      </button>

    </form>

    <p
      id="error"
      style="color: #ff6b6b;"
    ></p>

    <a
      href="/"
      class="admin-link"
    >
      ← Back to game
    </a>

  </section>

</main>


<script>

const form =
  document.querySelector(
    "#loginForm"
  );

const password =
  document.querySelector(
    "#password"
  );

const error =
  document.querySelector(
    "#error"
  );


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    error.textContent = "";

    try {

      const response =
        await fetch(
          "/admin-login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                password:
                  password.value
              })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        error.textContent =
          data.error ||
          "Login failed.";

        password.select();

        return;
      }

      window.location.href =
        "/admin.html";

    } catch (err) {

      error.textContent =
        "Could not connect to the server.";

    }

  }
);

</script>

</body>
</html>
